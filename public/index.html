<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calverath Empire — Job Vacancy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Special+Elite&family=Jost:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#060606; --wine:#3a0d0f; --ember:#8c8276; --gold:#c7bfae; --bone:#d9d3c6; --dim:#726e67;
  --d1:'Cinzel',Georgia,serif;
  --d2:'Special Elite',Georgia,monospace;
  --body:'Jost',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:66px;font-size:93%}
body{margin:0;background:var(--ink);color:var(--bone);font:400 1.14rem/1.75 var(--body);letter-spacing:.01em;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:-2;background:#000 center 20% / cover no-repeat}
#veil{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(ellipse at 50% 15%,rgba(0,0,0,.5),rgba(0,0,0,.95) 78%),
  linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.85))}
#embers{position:fixed;inset:0;z-index:0;pointer-events:none}
#nav,#hero,main,footer{position:relative;z-index:1}

#nav{position:sticky;top:0;z-index:30;display:flex;gap:.1rem;overflow-x:auto;justify-content:safe center;padding:.6rem 1rem;
  background:#000;border-bottom:1px solid #2a2622;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav a{color:var(--dim);text-decoration:none;font:600 .82rem var(--body);text-transform:uppercase;letter-spacing:.18em;padding:.4rem .9rem;white-space:nowrap;border:1px solid transparent}
#nav a:hover,#nav a:focus-visible{color:var(--bone);border-color:#3a3630;outline:none}

#hero{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4.5rem 1.2rem 2rem}
#hero h1{margin:0;font:900 clamp(2.1rem,7.6vw,4rem)/1.1 var(--d1);color:#efe9da;letter-spacing:.14em;text-transform:uppercase;
  text-shadow:0 2px 0 #000,0 0 40px rgba(0,0,0,.8);
  animation:kindle 1.6s ease-out both}
#hero .sub{margin:1rem 0 0;font:400 clamp(.95rem,2.4vw,1.15rem) var(--d2);letter-spacing:.34em;text-transform:uppercase;color:var(--wine);text-shadow:0 0 1px rgba(255,255,255,.1)}
#hero .tag{margin:.7rem 0 0;font:italic 400 1.05rem var(--body);color:var(--dim)}
.rule{display:flex;align-items:center;gap:.9rem;width:min(300px,55vw);margin:1.7rem auto 0;color:#3a3630}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:#3a3630}
.rule i{font-style:normal;font-size:.7rem;letter-spacing:.2em;color:var(--wine)}
@keyframes kindle{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}

main{width:min(860px,94vw);margin:0 auto;padding-bottom:4rem}
.panel{position:relative;margin:0 0 2.2rem;padding:1.8rem clamp(1.1rem,4vw,2.4rem) 2rem;
  background:#0b0b0a;border:1px solid #221f1c}
.panel>h2,.panel>h2[data-f]{margin:0 0 1.3rem;font:700 clamp(1.25rem,3.4vw,1.8rem)/1.3 var(--d1);color:#efe9da;text-transform:uppercase;letter-spacing:.1em;
  padding-bottom:.8rem;border-bottom:1px solid #242019;display:flex;align-items:center;gap:.6rem}
.panel>h2::before,.panel>h2[data-f]::before{content:"§";color:var(--wine);font-family:var(--d1);font-weight:900}

.block{position:relative;margin-bottom:1.5rem}
.block:last-of-type{margin-bottom:.4rem}
.block h3{margin:0 0 .5rem;font:400 1.05rem var(--d2);letter-spacing:.02em;color:var(--dim);text-transform:uppercase}
.p{white-space:pre-wrap;overflow-wrap:anywhere;max-width:66ch;color:var(--bone)}

.ghead{display:flex;align-items:center;gap:.9rem;margin:1.7rem 0 .9rem}
.ghead:first-of-type{margin-top:.2rem}
.gname{margin:0;font:600 1.02rem var(--d2);letter-spacing:.05em;color:var(--gold);text-transform:uppercase}
.ghead::after{content:"";flex:1;height:1px;background:#242019}

.jobs{display:grid;gap:.7rem}
.job{position:relative;display:grid;grid-template-columns:2.1rem minmax(0,1fr);gap:.9rem;padding:1rem 1.1rem;background:#0f0e0c;border:1px solid #221f1c;border-left:3px solid var(--wine)}
.jnum{font:400 1.3rem/1 var(--d2);color:var(--wine);text-align:center}
.jtitle{margin:0;font:600 1.18rem var(--body);letter-spacing:.01em;color:var(--bone);text-transform:uppercase}
.jdesc{margin:.45rem 0 0;color:var(--dim)}
.jmeta{margin:.4rem 0 0;font:.92rem var(--d2);color:#5c584f;letter-spacing:.02em}

footer{text-align:center;padding:1.8rem 1rem 6rem;color:#5c584f;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid #221f1c;background:#000}

#lock{position:fixed;right:14px;bottom:14px;z-index:40;width:38px;height:38px;border-radius:0;background:#000;border:1px solid #2a2622;color:var(--dim);font:1rem var(--body);cursor:pointer;opacity:.6}
#lock:hover,#lock:focus-visible{opacity:1;color:var(--bone);outline:none;border-color:var(--wine)}
.editing #lock{display:none}

#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9)}
#modal.on{display:flex}
#modal form{width:min(300px,90vw);padding:1.6rem;background:#0b0a09;border:1px solid var(--wine);text-align:center}
#modal h4{margin:0 0 1rem;font:400 1.1rem var(--d2);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
#modal input{width:100%;padding:.6rem;text-align:center;letter-spacing:.5em;font:1.3rem var(--body);background:#000;border:1px solid #2a2622;color:var(--bone)}
#modal input:focus{outline:1px solid var(--wine)}
#modal .err{min-height:1.3rem;margin:.55rem 0;color:#b4524f;font-size:.9rem}
#modal .row{display:flex;gap:.6rem;justify-content:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.btn,.ctl button,#bar button{font:500 .85rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--bone);background:#111;border:1px solid #2a2622;padding:.32rem .8rem;cursor:pointer;line-height:1.4}
.btn:hover,.ctl button:hover,#bar button:hover{background:#1c1a17;border-color:var(--gold)}
.ctl{display:none;gap:.25rem;align-items:center}
.ctl button{padding:.08rem .5rem}
.ctl .x:hover{background:#4a1114;border-color:#b4524f}
.ctl .tag{font:.78rem var(--d2);color:var(--gold);margin-right:.5rem;text-transform:uppercase;letter-spacing:.06em}
.editing .ctl{display:inline-flex}
.editing .block>.ctl,.editing .job>.ctl{position:absolute;top:.15rem;right:.15rem}
.editing .panel>.ctl{display:flex;justify-content:flex-end;margin-bottom:.7rem}
.editing .block,.editing .job{padding-top:1.8rem}
.editing .block{border:1px dashed #352f26;padding:1.8rem .8rem .8rem}
.editing .ghead .ctl{margin-left:auto}
.editing [data-f]{outline:1px dashed #4a4236;outline-offset:3px;cursor:text;min-width:2ch;min-height:1.2em}
.editing [data-f]:focus{outline:1px solid var(--gold);background:rgba(199,191,174,.08)}
.editing [data-f]:empty::before{content:attr(data-ph);color:#5c584f;font-style:italic;font-family:var(--body);font-size:.95rem;letter-spacing:0;text-transform:none}
.addrow{margin-top:1rem;display:none}
.editing .addrow{display:block}
.addsec{display:none;margin:0 0 3rem;padding:1.3rem;border:1px dashed #352f26;background:#000;text-align:center}
.editing .addsec{display:block}
.addsec select{font:.95rem var(--body);padding:.35rem;background:#000;color:var(--bone);border:1px solid #2a2622;margin-right:.5rem}

#bar{display:none;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:60;gap:.4rem;flex-wrap:wrap;justify-content:center;
  width:min(96vw,720px);padding:.6rem;background:#0b0a09;border:1px solid #2a2622}
.editing #bar{display:flex}
#bar .primary{background:var(--wine);border-color:#b4524f;color:#efe9da}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:90;padding:.6rem 1.1rem;background:#000;border:1px solid #2a2622;color:var(--bone);opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

<main id="app"></main>

<div id="ui"></div>

var esc=function(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

function cyrb53(str,seed){seed=seed||0;var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
var H=function(p){return cyrb53('jobs|'+p)};

function get(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k]},D)}
function set(p,v){var ks=p.split('.'),last=ks.pop();ks.reduce(function(o,k){return o[k]},D)[last]=v}
function arrOf(p){var ks=p.split('.'),i=+ks.pop();return [get(ks.join('.')),i]}
var dirty=false,PIN='';
function save(){dirty=true;var b=$('#savebtn');if(b)b.textContent='Save to site ●'}
window.addEventListener('beforeunload',function(e){if(editing&&dirty){e.preventDefault();e.returnValue=''}});
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},3200)}
var uid=function(){return 's'+Math.random().toString(36).slice(2,8)};

var NEW={
  block:function(){return {h:'',p:''}},
  job:function(){return {title:'',desc:'',meta:''}},
  group:function(){return {name:'New department',items:[NEW.job()]}},
  text:function(){return {id:uid(),type:'text',title:'New section',blocks:[NEW.block()]}},
  jobs:function(){return {id:uid(),type:'jobs',title:'New jobs section',groups:[NEW.group()]}}
};
var TYPENAME={text:'Text section',jobs:'Job listing section'};

function F(p,tag,cls,ph){var v=get(p)||'';if(!v&&!editing)return '';return '<'+tag+' class="'+(cls||'')+'" data-f="'+p+'" data-ph="'+esc(ph||'')+'">'+esc(v)+'</'+tag+'>'}
function ctl(p,pre){return '<span class="ctl">'+(pre||'')+'<button data-a="up" data-p="'+p+'" title="Move up" aria-label="Move up">↑</button><button data-a="dn" data-p="'+p+'" title="Move down" aria-label="Move down">↓</button><button class="x" data-a="del" data-p="'+p+'" title="Delete" aria-label="Delete">✕</button></span>'}
function addBtn(p,t,label){return '<div class="addrow"><button class="btn" data-a="add" data-p="'+p+'" data-t="'+t+'">+ '+label+'</button></div>'}

function blockHTML(b,P){
  return '<div class="block">'+ctl(P)+F(P+'.h','h3','','Heading (optional)')+F(P+'.p','div','p','Write your text here…')+'</div>';
}
function jobsHTML(s,P){
  return s.groups.map(function(g,gi){
    var GP=P+'.groups.'+gi;
    return '<div class="ghead">'+F(GP+'.name','h3','gname','Department / organization name')+ctl(GP)+'</div><div class="jobs">'+
      g.items.map(function(j,ji){var JP=GP+'.items.'+ji;
        return '<article class="job">'+ctl(JP)+'<div class="jnum" aria-hidden="true">№</div><div>'+
          F(JP+'.title','h4','jtitle','Job name')+F(JP+'.desc','p','jdesc','Job description')+F(JP+'.meta','div','jmeta','Requirements / contact (optional)')+'</div></article>'}).join('')+
      '</div>'+addBtn(GP+'.items','job','Add job opening');
  }).join('')+addBtn(P+'.groups','group','Add department');
}
function sectionHTML(s,i){
  var P='sections.'+i,inner='';
  if(s.type==='text')inner=s.blocks.map(function(b,j){return blockHTML(b,P+'.blocks.'+j)}).join('')+addBtn(P+'.blocks','block','Add block');
  else if(s.type==='jobs')inner=jobsHTML(s,P);
  return '<section class="panel" id="'+s.id+'">'+ctl(P,'<span class="tag">'+(TYPENAME[s.type]||s.type)+'</span>')+F(P+'.title','h2','','Section title')+inner+'</section>';
}
function renderNav(){$('#nav').innerHTML=D.sections.map(function(s){return '<a href="#'+s.id+'">'+esc(s.title||'…')+'</a>'}).join('')}
function render(){
  $('#hero').innerHTML=F('hero.title','h1','','Site name')+F('hero.sub','p','sub','Subtitle')+F('hero.tag','p','tag','Tagline')+'<div class="rule"><i>†</i></div>';
  $('#app').innerHTML=D.sections.map(sectionHTML).join('')+
    '<div class="addsec"><select id="newtype"><option value="jobs">Job listing section</option><option value="text">Text section</option></select><button class="btn" data-a="addsec">+ Add new section</button></div>';
  $('#footer').innerHTML=F('footer','div','','Footer text');
  renderNav();
  document.body.classList.toggle('editing',editing);
  $('#bg').style.backgroundImage='url("'+D.bg+'")';
  if(editing)document.querySelectorAll('[data-f]').forEach(function(el){try{el.contentEditable='plaintext-only'}catch(e){el.contentEditable='true'}});
}

document.addEventListener('input',function(e){
  var el=e.target.closest&&e.target.closest('[data-f]');
  if(!el){return}
  var v=el.innerText.replace(/\u00a0/g,' ').replace(/\n$/,'');
  if(!v)el.innerHTML='';
  set(el.dataset.f,v);save();
  if(/\.title$/.test(el.dataset.f))renderNav();
});
document.addEventListener('paste',function(e){
  var el=e.target.closest&&e.target.closest('[data-f]');if(!el)return;
  e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));
});
document.addEventListener('keydown',function(e){
  var el=e.target.closest&&e.target.closest('[data-f]');
  if(el&&e.key==='Enter'&&/^(H1|H2|H3|H4)$/.test(el.tagName))e.preventDefault();
  if(e.key==='Escape')closeModal();
});
function fileToURL(file,max,q,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    var x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};im.src=r.result};
  r.readAsDataURL(file);
}
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='restorefile'&&t.files[0]){var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o.sections||!o.sections.length)throw 0;D=o;save();render();toast('Backup loaded. Click "Save to site" to publish it.')}catch(x){toast('That file is not a valid backup.')}};rd.readAsText(t.files[0]);t.value=''}
  if(t.id==='bgfile'&&t.files[0]){fileToURL(t.files[0],1800,.82,function(u){D.bg=u;save();render();toast('Background updated')});t.value=''}
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,p=b.dataset.p;
  if(a==='lock'){openModal();return}
  if(a==='exit'){editing=false;render();return}
  if(a==='publish'){publish();return}
  if(a==='backup'){backup();return}
  if(a==='restore'){$('#restorefile').click();return}
  if(a==='pin'){changePin();return}
  if(a==='reset'){if(confirm('Discard all unsaved changes and reload?')){dirty=false;location.reload()}return}
  if(a==='bg'){$('#bgfile').click();return}
  if(a==='up'||a==='dn'){var r=arrOf(p),arr=r[0],i=r[1],j=a==='up'?i-1:i+1;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t}
  else if(a==='del'){if(!confirm('Delete this item?'))return;var r2=arrOf(p);r2[0].splice(r2[1],1)}
  else if(a==='add'){get(p).push(NEW[b.dataset.t]())}
  else if(a==='addsec'){D.sections.push(NEW[$('#newtype').value]());render();save();var last=D.sections[D.sections.length-1];var el=document.getElementById(last.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  render();save();
});

var fails=0,blockedUntil=0;
$('#ui').innerHTML=
 '<button id="lock" data-a="lock" aria-label="Edit site" title="Edit">†</button>'+
 '<div id="modal" role="dialog" aria-modal="true" aria-label="Enter PIN"><form id="pinform" autocomplete="off"><h4>Enter the PIN</h4>'+
 '<input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN"><div class="err" id="pinerr" role="alert"></div>'+
 '<div class="row"><button type="submit" class="btn primary">Unlock</button><button type="button" class="btn" id="pincancel">Cancel</button></div></form></div>'+
 '<div id="bar"><button id="savebtn" data-a="publish" class="primary">Save to site</button><button data-a="bg">Change background</button><button data-a="pin">Change PIN</button><button data-a="backup">Download backup</button><button data-a="restore">Restore backup</button><button data-a="reset">Discard changes</button><button data-a="exit">Exit edit mode</button><input type="file" id="bgfile" accept="image/*" hidden><input type="file" id="restorefile" accept="application/json,.json" hidden></div>'+
 '<div id="toast" role="status"></div>';
function openModal(){$('#modal').classList.add('on');$('#pin').value='';$('#pinerr').textContent='';setTimeout(function(){$('#pin').focus()},30)}
function closeModal(){$('#modal').classList.remove('on')}
$('#pincancel').addEventListener('click',closeModal);
function api(body){
  return fetch('/api/jobs-content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){j.status=r.status;j.ok=r.ok;return j})})
    .catch(function(){return {ok:false,status:0}});
}
$('#pinform').addEventListener('submit',function(e){
  e.preventDefault();
  var now=Date.now(),pin=$('#pin').value;
  if(now<blockedUntil){$('#pinerr').textContent='Too many attempts. Wait '+Math.ceil((blockedUntil-now)/1000)+'s.';return}
  $('#pinerr').textContent='Checking…';
  api({action:'auth',pin:pin}).then(function(r){
    if(r.ok){fails=0;PIN=pin;closeModal();editing=true;render();toast('Edit mode on. Click any text to change it.')}
    else if(r.status===401){fails++;$('#pinerr').textContent='Wrong PIN.';var f=$('#pinform');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('#pin').value='';if(fails>=5){blockedUntil=Date.now()+30000;fails=0}}
    else if(r.status===429){$('#pinerr').textContent='Too many attempts. Try again in a minute.'}
    else{$('#pinerr').textContent='Cannot reach the server. Is the function deployed?'}
  });
});
function publish(){
  var payload={action:'save',pin:PIN,data:D};
  if(JSON.stringify(payload).length>5.5*1024*1024){toast('Content is too large (over 5.5 MB). Remove or shrink some images.');return}
  toast('Saving…');
  api(payload).then(function(r){
    if(r.ok){dirty=false;$('#savebtn').textContent='Save to site';toast('Saved. Your site is updated.')}
    else if(r.status===401){toast('PIN rejected. Exit edit mode and unlock again.')}
    else if(r.status===413){toast('Content is too large. Shrink some images.')}
    else{toast('Save failed (error '+r.status+'). Your changes are still on this page.')}
  });
}
function changePin(){
  var n=prompt('Enter a new PIN (at least 4 characters):');
  if(!n)return;if(n.length<4){toast('PIN too short. Nothing changed.');return}
  api({action:'setpin',pin:PIN,newPin:n}).then(function(r){if(r.ok){PIN=n;toast('PIN changed.')}else toast('Could not change PIN (error '+r.status+').')});
}
function backup(){
  var blob=new Blob([JSON.stringify(D)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='calverath-jobs-backup.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

(function(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=$('#embers'),x=c.getContext('2d'),W,Hh,ps=[];
  function rs(){W=c.width=innerWidth;Hh=c.height=innerHeight}rs();addEventListener('resize',rs);
  function mk(init){return {x:Math.random()*W,y:init?Math.random()*Hh:-10,r:Math.random()*1.4+.3,v:Math.random()*.22+.06,d:Math.random()*6.28,a:Math.random()*.3+.08}}
  for(var i=0;i<30;i++)ps.push(mk(true));
  (function tick(){
    x.clearRect(0,0,W,Hh);
    ps.forEach(function(p){p.y+=p.v;p.d+=.008;p.x+=Math.sin(p.d)*.3;if(p.y>Hh+10)Object.assign(p,mk());
      x.beginPath();x.fillStyle='rgba(180,176,165,'+p.a+')';x.arc(p.x,p.y,p.r,0,6.283);x.fill()});
    requestAnimationFrame(tick);
  })();
})();

function boot(){
  var done=false,ctrl=window.AbortController?new AbortController():null;
  function go(d){if(done)return;done=true;if(d&&d.sections&&d.sections.length)D=d;render()}
  var to=setTimeout(function(){go(null);if(ctrl)ctrl.abort()},4000);
  fetch('/api/jobs-content',{cache:'no-store',signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.ok?r.json():null}).then(function(d){clearTimeout(to);go(d)}).catch(function(){clearTimeout(to);go(null)});
}
boot();
})();
</script>
</body>
</html>
